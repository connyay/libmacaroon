[package]
name = "libmacaroon"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = [
    "Connor Hindley <conn.hindley@gmail.com>",
    "Jack Lund <jackl@geekheads.net>",
    "macaroon-rs Contributors",
]
description = "Macaroons (bearer credentials with contextual caveats) in pure Rust, with first-party and third-party caveats, WASM support, and cross-language interop."
documentation = "https://docs.rs/libmacaroon"
repository = "https://github.com/connyay/libmacaroon"
homepage = "https://github.com/connyay/libmacaroon"
readme = "README.md"
keywords = ["macaroon", "authorization", "credentials", "bearer-token"]
categories = ["authentication", "cryptography"]
license = "MIT"

[features]
default = ["v2json"]
wasm = ["getrandom/wasm_js"]
# Enables the V2JSON serialization format. Pulls in `serde` (with derives)
# and `serde_json`. Disable with `default-features = false` to drop the
# JSON deserializer (~50 KB of compiled code) when only the binary V1/V2
# formats are needed.
v2json = ["dep:serde", "dep:serde_json"]

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# Only the scalar `GeneralPurpose` engines are used, so the default-on
# `simd-unsafe` feature is left off; without it base64 builds under
# `forbid(unsafe_code)`, as 0.22 always did.
base64 = { version = "0.23", default-features = false, features = ["std"] }

# Crypto (RustCrypto ecosystem — pure Rust, WASM-compatible)
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
crypto_secretbox = { version = "0.1", default-features = false, features = ["alloc", "salsa20"] }
getrandom = "0.4"
subtle = "2.6"
# 1.9.0 zeroized through an `optimization_barrier` whose non-asm
# fallback (taken on wasm32) could read uninitialized memory; 1.9.1
# fixes it.
zeroize = { version = "1.9.1", features = ["derive"] }

# proptest pulls in rand 0.9 -> getrandom 0.3, a different major version
# than the getrandom 0.4 we use directly, with its own (unset) wasm32
# backend. Cargo includes dev-dependencies when building examples, so the
# WASM example build would fail on that mismatch. The property tests don't
# run on wasm32 targets anyway — scope them to everything else.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"
